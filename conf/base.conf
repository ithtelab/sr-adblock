#     在模块层解决（改 allowlist 重新构建，或单独停用对应的 per-App 模块）。
# ----------------------------------------------------------------------
DOMAIN-SUFFIX,ems.youku.com,DIRECT
DOMAIN-SUFFIX,hudong.alicdn.com,DIRECT
DOMAIN-SUFFIX,ossgw.alicdn.com,DIRECT
DOMAIN-SUFFIX,wxs.qq.com,DIRECT

