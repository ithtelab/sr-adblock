    trust: true
    repo: https://github.com/fmz200/wool_scripts
    license: 未声明
    note: 可莉模块的域名层子集，与上面的 blockAds 模块同源，便于保持两层一致。

  - id: iab0x00
    name: iab0x00 • Block 轻量去广告
    url: https://raw.githubusercontent.com/iab0x00/ProxyRules/main/Rule/Block.txt
    format: ruleset
    trust: true
    repo: https://github.com/iab0x00/ProxyRules
    license: 无许可证
