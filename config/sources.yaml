# ---------------------------------------------------------------------------
# per-App 可选模块来源（Phase 2 使用）
# ---------------------------------------------------------------------------
app_module_source:
  # ⚠ 已知的上游缺陷（本项目会自动修一部分，剩下的见下）：
  #
  # 1. 【已自动修复】50 个模块的重写规则要解密某个主机，却没把主机名声明进
  #    [MITM]，规则永远不执行。构建时从规则模式反推补齐（金融类受守卫保护，见
  #    options.yaml 的 derive_mitm_hosts 与 config/mitm-extra.txt）。
  #
  # 2. 【无法自动判断，仅记录】东方财富的模块 split/partD/DongFangCaiFu.sgmodule
  #    里混进了"东方航空"的规则：它的 [MITM] 写的是 app.ceair.com，
  #    还带两条 app.ceair.com 的 Map Local —— 两个 App 中文名都叫"东方X"，
  #    上游大概率因此复制错了文件。后果是该模块里唯一那条东方财富重写规则
  #    （emdcadvertise.eastmoney.com）永远不会触发；而装了它会去解密东方航空的域名。
  #    同时注意：东方航空没有单独的模块，它的规则只存在于这个文件里，所以
  #    不能简单删掉。东方财富的开屏广告实际由域名层覆盖，不受影响。
  # 可莉的 split 目录是小火箭/各客户端通用的 per-App 模块，结构为
  # Surge/module/split/part<字母>/<AppName>.sgmodule
  # 我们取 Surge 版（比 SR 版多 9 条规则），转换后输出为 .srmodule
  raw_base: https://raw.githubusercontent.com/fmz200/wool_scripts/main
  list_api: https://api.github.com/repos/fmz200/wool_scripts/git/trees/main?recursive=1
  path_prefix: Surge/module/split/
  path_suffix: .sgmodule

# ---------------------------------------------------------------------------
# 额外可选模块（不属于去广告三层，按需单独导入）
#
# 与 module_sources 的区别：这些**不并入 ads-all**，各自独立产出到
# dist/module/extra/。因为它们是不同的东西（证书、加速、WiFi Calling、单 App 增强），
# 混进主模块会让不想用的人被动接受，也会让主模块的 MITM 主机名继续膨胀。
#
# 构建时会统一做：脚本本地化、外部规则集本地化、MITM 主机名补全、脏数据校验，
# 并**保留上游的 #!arguments**（那是用户在手机上配置它们的界面）。
#
# kind: module  = 直接抓一个模块文件
#       ruleset = 抓一个纯规则集（有类型、无策略列），包成模块的 [Rule] 段
# ---------------------------------------------------------------------------
extra_module_sources:

  # ── 证书 / 安全 ───────────────────────────────────────────────
  - id: ca-module
    kind: module
    name: 证书模块（换配置不再掉解密）
    output: ca-module
    group: 证书 / 安全
    url: https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/main/CA.sgmodule
    repo: https://github.com/LOWERTOP/Shadowrocket-First
    author: LOWERTOP
    note: |
      ★ 解决一个真实痛点：小火箭的 HTTPS 解密是**跟配置走**的，换一次配置就要重开一次。
      装了它，把证书内容填进参数，解密状态就跟着模块走。
      需要自己在「编辑参数」里粘贴证书内容（ca-p12）和密码。
    usage: 装好后点模块的「编辑参数」，把证书内容与密码填进去，再打开「证书模块」开关

  - id: vpn-detected
    kind: module
    name: 防 VPN / 代理检测
    output: vpn-detected
    group: 证书 / 安全
    url: https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/main/VPNdetected.sgmodule
    repo: https://github.com/LOWERTOP/Shadowrocket-First
    author: LOWERTOP
    note: 让 App 检测不到你在用代理（把检测用的域名跳过代理）。很多国内 App 会因代理检测报错

  # ── GitHub 体验包 ─────────────────────────────────────────────
  - id: github-pro
    kind: module
    name: GitHub Pro
    output: github-pro
    group: GitHub 体验包
    url: https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/main/GitHubPro.sgmodule
    repo: https://github.com/LOWERTOP/Shadowrocket-First
    author: LOWERTOP
    note: 私有库/大文件加速。**14 个参数，装完要按需填写**（私库地址等）

  - id: github-cdn
    kind: module
    name: GitHub 资源加速（302 到 jsDelivr）
