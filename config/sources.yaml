    group: GitHub 体验包
    url: https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/main/GitHubCDN.sgmodule
    repo: https://github.com/LOWERTOP/Shadowrocket-First
    author: LOWERTOP
    note: 把 raw.githubusercontent.com 的请求 302 到国内可用的 jsDelivr 镜像。**国内刚需**

  - id: github-no-zoom
    kind: module
    name: GitHub iOS 禁止缩放
    output: github-no-zoom
    group: GitHub 体验包
    url: https://raw.githubusercontent.com/LOWERTOP/Shadowrocket-First/main/GitHub-iOS-No-Zoom.sgmodule
    repo: https://github.com/LOWERTOP/Shadowrocket-First
    author: LOWERTOP
    note: 手机上逛 GitHub 时禁止页面缩放，浏览体验好很多

  # ── 插件生态 ──────────────────────────────────────────────────
  - id: plugin2rocket
    kind: module
    name: 可莉插件中心转换器（自包含 Script-Hub）
    output: plugin2rocket
    group: 插件生态
    url: https://raw.githubusercontent.com/iab0x00/ProxyRules/main/Rewrite/Plugin2Rocket.srmodule
    repo: https://github.com/iab0x00/ProxyRules
    author: iab0x00 / LOWERTOP
    note: |
      ★ 打通另一个生态：把「可莉插件中心」(hub.kelee.one) 的 Loon 插件，
      在手机上**实时转换成小火箭模块**。已内嵌 Script-Hub 脚本，不需要额外装依赖。

